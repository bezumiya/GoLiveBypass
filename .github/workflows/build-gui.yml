name: build-gui

# Manual de proposito: roda quando a gente dispara para uma tag de release, constroi os
# tres artefatos da GUI (exe Windows, AppImage Linux, dmg/zip macOS) e publica na release
# com o metadata do auto-update (latest*.yml). O electron-builder publica direto na
# release do GitHub — o app consulta a mesma release para se atualizar sozinho.
# Mac e Linux nao compilam no Windows, entao eles nascem aqui.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release que recebe os artefatos (ex.: v1.1.2)'
        required: true
        type: string
      canal:
        description: 'Canal da release: stable (padrao) ou beta (prerelease — so testadores com o opt-in da GUI recebem; /releases/latest nunca devolve prerelease)'
        required: false
        type: string
        default: stable

      rascunho:
        description: 'Manter como draft para conferir todos os artefatos antes de publicar'
        required: false
        type: boolean
        default: false

# O publisher respeita draft existente; o override também protege sua criação.
env:
  EP_DRAFT: ${{ inputs.rascunho && 'true' || 'false' }}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/proton-confgen/go.mod
          cache-dependency-path: tools/proton-confgen/go.sum
      - run: npm ci
        working-directory: golive-gui
      # --publish always: gera o GoLiveBypass.exe + latest.yml e faz upload na release
      # (o GH_TOKEN do workflow vira o GH_TOKEN que o electron-builder usa).
      # No canal beta a release nasce como draft; beta-marcar aplica a classificação
      # PRERELEASE depois que Windows e Linux terminarem — nunca vira "latest".
      - run: npm run publish:win
        if: ${{ inputs.canal != 'beta' }}
        working-directory: golive-gui
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run publish:win -- --config.publish.channel=beta --config.publish.releaseType=prerelease
        if: ${{ inputs.canal == 'beta' }}
        working-directory: golive-gui
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/proton-confgen/go.mod
          cache-dependency-path: tools/proton-confgen/go.sum
      - run: npm ci
        working-directory: golive-gui
      # No canal beta publica AppImage + beta.yml (electron-updater com
      # allowPrerelease consome o canal beta.yml que o electron-builder gera
      # sozinho para versao com sufixo de prerelease).
      - run: npm run publish:linux
        if: ${{ inputs.canal != 'beta' }}
        working-directory: golive-gui
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run publish:linux -- --config.publish.channel=beta --config.publish.releaseType=prerelease
        if: ${{ inputs.canal == 'beta' }}
        working-directory: golive-gui
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  proton-runtime-assets:
    # Os helpers sao um reparo de contingencia para instalacoes que perderam
    # extraResources. Compila com as mesmas flags deterministicas do build local
    # e so publica depois dos dois artefatos da GUI estarem prontos.
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/proton-confgen/go.mod
          cache-dependency-path: tools/proton-confgen/go.sum
      - name: Compilar helpers Proton para reparo
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          MANIFEST="golive-gui/../tools/proton-confgen/build/proton-confgen-manifest.json"
          node golive-gui/scripts/build-proton.mjs
          test "$(jq -r '.version' "$MANIFEST")" = "$VERSION"
          mkdir -p runtime
          cp tools/proton-confgen/build/proton-confgen \
            "runtime/GoLiveBypass-${VERSION}-proton-confgen-linux-x64"
          cp tools/proton-confgen/build/proton-confgen.exe \
            "runtime/GoLiveBypass-${VERSION}-proton-confgen-win-x64.exe"
          sha256sum runtime/GoLiveBypass-"${VERSION}"-proton-confgen-linux-x64 \
            > runtime/GoLiveBypass-"${VERSION}"-proton-confgen-linux-x64.sha256
          sha256sum runtime/GoLiveBypass-"${VERSION}"-proton-confgen-win-x64.exe \
            > runtime/GoLiveBypass-"${VERSION}"-proton-confgen-win-x64.exe.sha256
      - name: Comparar hashes do manifesto com os assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          MANIFEST="tools/proton-confgen/build/proton-confgen-manifest.json"
          test "$(jq -r '.version' "$MANIFEST")" = "$VERSION"
          for pair in \
            "linux-x64|GoLiveBypass-${VERSION}-proton-confgen-linux-x64" \
            "win32-x64|GoLiveBypass-${VERSION}-proton-confgen-win-x64.exe"; do
            key="${pair%%|*}"
            asset="${pair#*|}"
            expected="$(jq -r --arg key "$key" '.assets[$key].sha256' "$MANIFEST")"
            actual="$(sha256sum "runtime/$asset" | awk '{print $1}')"
            test "$expected" != "null"
            if [[ "$expected" != "$actual" ]]; then
              echo "Hash divergente para $asset: manifesto=$expected asset=$actual" >&2
              exit 1
            fi
          done
      - name: Upload dos helpers Proton
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: ${{ inputs.rascunho }}
          files: |
            runtime/GoLiveBypass-*-proton-confgen-linux-x64
            runtime/GoLiveBypass-*-proton-confgen-linux-x64.sha256
            runtime/GoLiveBypass-*-proton-confgen-win-x64.exe
            runtime/GoLiveBypass-*-proton-confgen-win-x64.exe.sha256
          fail_on_unmatched_files: true

  macos:
    # No canal beta o mac pula: o updater dele ja esta desligado no codigo (app
    # nao assinado) — nao ha o que testar lá, e buildar sem consumidor e ruido.
    if: ${{ inputs.canal != 'beta' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/proton-confgen/go.mod
          cache-dependency-path: tools/proton-confgen/go.sum
      - run: npm ci
        working-directory: golive-gui
      # Com CSC_LINK/CSC_KEY_PASSWORD o electron-builder assina o app; sem eles, builda
      # sem assinatura (auto-update do Mac so funciona com app assinado).
      - run: npm run publish:mac
        working-directory: golive-gui
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}


  release-assets:
    # Sobe os assets de update que NAO dependem do electron-builder: o zip do
    # userplugin Vencord e o bypass standalone "puro". Roda em paralelo com os
    # builds da GUI (sao independentes). No canal beta pula: plugin/CLI nao estao
    # no ciclo de teste da GUI, e um goLiveBypass-vencord.zip beta numa prerelease
    # poderia ser pego pelo updater do plugin.
    if: ${{ inputs.canal != 'beta' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ inputs.tag }}"
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/proton-confgen/go.mod
          cache-dependency-path: tools/proton-confgen/go.sum

      - name: Determinar versao da tag
        id: version
        env:
          # GITHUB_REF_NAME no workflow_dispatch e a BRANCH de disparo (ex.: main),
          # nao a tag. O nome dos assets tem que sair do input, senao o bypass puro
          # vai para a release como "GoLiveBypass-main-bypass.js".
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          # Semver: v1.2.3 -> 1.2.3
          echo "version=${RELEASE_TAG#v}" >> $GITHUB_OUTPUT
          echo "tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          # Bypass standalone tem versao no nome (download manual, sem auto-update).
          echo "bypass_basename=GoLiveBypass-${RELEASE_TAG#v}-bypass" >> $GITHUB_OUTPUT
          # Userplugin tem nome fixo (igual ao assetName do manifest.json) para que o
          # Vencord sempre baixe o asset mais recente independente da tag.
          echo "vencord_basename=goLiveBypass-vencord" >> $GITHUB_OUTPUT

      - name: Zip do userplugin Vencord (Onda 2 do auto-update)
        run: |
          mkdir -p goLiveBypass/bin/win32-x64
          cd tools/proton-confgen
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags='-s -w' \
            -o ../../goLiveBypass/bin/win32-x64/proton-confgen.exe ./cmd/protonvpn-wg
          cd ../..
          cd goLiveBypass
          # Garante que o manifest tem a versao da tag (CI e a fonte da verdade).
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${{ steps.version.outputs.version }}\"/" manifest.json
          cd ..
          zip -r "${{ steps.version.outputs.vencord_basename }}.zip" goLiveBypass/

      - name: Bypass standalone "puro" (para distribuicao manual)
        run: |
          cp standalone/golivebypass.js "${{ steps.version.outputs.bypass_basename }}.js"

      - name: SHA-256 dos novos assets
        run: |
          sha256sum "${{ steps.version.outputs.vencord_basename }}.zip" > "${{ steps.version.outputs.vencord_basename }}.zip.sha256"
          sha256sum "${{ steps.version.outputs.bypass_basename }}.js" > "${{ steps.version.outputs.bypass_basename }}.js.sha256"

      - name: Upload dos assets para a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ inputs.tag }}"
          draft: ${{ inputs.rascunho }}
          files: |
            ${{ steps.version.outputs.vencord_basename }}.zip
            ${{ steps.version.outputs.vencord_basename }}.zip.sha256
            ${{ steps.version.outputs.bypass_basename }}.js
            ${{ steps.version.outputs.bypass_basename }}.js.sha256
          fail_on_unmatched_files: true

  beta-marcar:
    # Garantia dupla do canal beta (§9): marca a release como PRERELEASE mesmo que
    # o override do electron-builder falhe (prerelease NUNCA vira "latest" — o
    # usuario estavel nem fica sabendo) e escreve a linha do canal na nota, que e
    # o que o testador le ao abrir a release.
    if: ${{ inputs.canal == 'beta' && !inputs.rascunho }}
    runs-on: ubuntu-latest
    needs: [windows, linux, proton-runtime-assets]
    steps:
      - name: Marcar prerelease e escrever a linha do canal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ inputs.tag }}" \
            --repo bezumiya/GoLiveBypass \
            --prerelease \
            --draft=false \
            --title "GoLiveBypass ${{ inputs.tag }}" \
            --notes "**Canal: beta** — versão de teste para quem optou em \"Participar dos testes\" nas configurações da GUI (Windows e Linux). Não é oferecida a quem usa o canal estável. Encontrou algo estranho? Use o botão Reportar bug do app — o relato vai com os logs completos."

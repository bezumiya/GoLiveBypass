name: plugin-startup-regressions

on:
  pull_request:
    paths:
      - 'goLiveBypass/**'
      - 'tests/test-plugin-update-lock.mjs'
      - 'tests/test-plugin-netns-environment.mjs'
      - 'tests/test-plugin-runtime-compatibility.mjs'
      - 'tests/test-plugin-autostart-loop.mjs'
      - 'tests/test-plugin-update-archive.mjs'
      # O teste de paridade também lê instaladores, standalone e partes da GUI.
      - 'tests/test-distribution-parity.cjs'
      - 'installer/**'
      - 'standalone/**'
      - 'golive-gui/electron/main.ts'
      - 'golive-gui/electron/preload.ts'
      - 'golive-gui/electron/bypass.ts'
      - 'golive-gui/index.html'
      - '.github/workflows/plugin-startup-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Testar lock, ambiente do helper e compatibilidade do plugin
        run: >-
          node --test
          tests/test-plugin-update-lock.mjs
          tests/test-plugin-netns-environment.mjs
          tests/test-plugin-runtime-compatibility.mjs
          tests/test-plugin-autostart-loop.mjs
          tests/test-plugin-update-archive.mjs
      # Runner próprio (para na primeira falha), fora do node --test: quem decide é o código de saída.
      - name: Testar paridade entre plugin, instaladores, standalone e GUI
        run: node tests/test-distribution-parity.cjs
